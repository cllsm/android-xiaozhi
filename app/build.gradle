plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}

def signingStorePath = System.getenv('XIAOZHI_STORE_FILE') ?: localProperties.getProperty('XIAOZHI_STORE_FILE')
def signingStorePassword = System.getenv('XIAOZHI_STORE_PASSWORD') ?: localProperties.getProperty('XIAOZHI_STORE_PASSWORD')
def signingKeyAlias = System.getenv('XIAOZHI_KEY_ALIAS') ?: localProperties.getProperty('XIAOZHI_KEY_ALIAS')
def signingKeyPassword = System.getenv('XIAOZHI_KEY_PASSWORD') ?: localProperties.getProperty('XIAOZHI_KEY_PASSWORD')
def releaseAbis = System.getenv('XIAOZHI_RELEASE_ABIS') ?: localProperties.getProperty('XIAOZHI_RELEASE_ABIS')
def neteaseLosslessAppKey = System.getenv('XIAOZHI_NETEASE_LOSSLESS_APP_KEY') ?: localProperties.getProperty('XIAOZHI_NETEASE_LOSSLESS_APP_KEY') ?: ''
def escapedNeteaseLosslessAppKey = neteaseLosslessAppKey.replace('\\', '\\\\').replace('"', '\\"')
def signingConfigReady = signingStorePath && signingStorePassword && signingKeyAlias && signingKeyPassword
def releaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('release')
}

if (!signingConfigReady && releaseBuildRequested) {
    throw new GradleException(
        'Xiaozhi signing config is required. Set XIAOZHI_STORE_FILE, ' +
        'XIAOZHI_STORE_PASSWORD, XIAOZHI_KEY_ALIAS, and XIAOZHI_KEY_PASSWORD ' +
        'in local.properties or the environment.'
    )
}

android {
    namespace 'com.xiaozhi.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.xiaozhi.android'
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName '1.0.0'
        buildConfigField 'String', 'NETEASE_LOSSLESS_APP_KEY', "\"${escapedNeteaseLosslessAppKey}\""
        if (releaseAbis) {
            ndk {
                abiFilters releaseAbis.split(',').collect { it.trim() }.findAll { it }
            }
        }
    }

    if (signingConfigReady) {
        signingConfigs {
            xiaozhiRelease {
                storeFile file(signingStorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (signingConfigReady) {
                signingConfig signingConfigs.xiaozhiRelease
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigReady) {
                signingConfig signingConfigs.xiaozhiRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    implementation files('libs/sherpa-onnx-1.13.6.aar')
    implementation platform('androidx.compose:compose-bom:2025.01.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.9.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.belerweb:pinyin4j:2.5.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
